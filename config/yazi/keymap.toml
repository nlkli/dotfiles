[mgr]
append_keymap = [
	{ on = [ "g", "s" ], run = "cd ~/Desktop", desc = "Go ~/Desktop" },
	{ on = [ "g", "p" ], run = "cd ~/Projects", desc = "Go ~/Projects" },
	{ on = [ "g", "o" ], run = "cd ~/Documents", desc = "Go ~/Documents" },
    { on = [ "i" ], run = 'shell -- recol -m %h', desc = "Run recol" },
]
